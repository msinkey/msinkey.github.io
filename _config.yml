# ============================================================
# _config.yml for an economist's site (Minimal Mistakes theme)
# Replace everything marked CHANGE. Keep spacing and colons as is.
# Use straight quotes (" ") and spaces, never tabs.
# ============================================================

# ---------- Site settings ----------
locale                   : "en-US"
title                    : "Michael Sinkey"                          # CHANGE
name                     : "Michael Sinkey"                          # CHANGE
description              : "applied micro. UWG."   # CHANGE
url                      : "https://msinkey.github.io"     # CHANGE
baseurl                  : ""
repository               : "msinkey/msinkey.github.io"  # CHANGE
breadcrumbs              : false
search                   : false
timezone                 : America/Chicago                      # CHANGE if needed

# ---------- Theme ----------
remote_theme             : "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin    : "default"    # other options: "air", "neutral", "dirt", "sunrise"

# ---------- Build settings ----------
markdown                 : kramdown
highlighter              : rouge
permalink                : /:categories/:title/
include:
  - _pages

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

# ---------- Defaults ----------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# ---------- Sidebar profile ----------
author:
  name             : "Michael Sinkey"                                # CHANGE
  avatar           : "/images/prof1.jpg"                      # photo in the images folder
  bio              : "Associate Professor of Economics. UWG."   # CHANGE
  location         : "Carrollton, GA"                              # CHANGE
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=PI6vA6sAAAAJ" # CHANGE or delete these 3 lines
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0003-3667-0690"              # CHANGE or delete these 3 lines
    
# ---------- Footer ----------
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/msinkey"                    # CHANGE

comments:
  provider               : false
analytics:
  provider               : false
